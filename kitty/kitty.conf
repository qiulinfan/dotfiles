# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window
window_padding_width 8
remember_window_size yes
initial_window_width  120c
initial_window_height 36c
confirm_os_window_close 0

# Cursor and scrolling
cursor_shape block
cursor_shape_unfocused block
cursor_blink_interval 0
scrollback_lines 10000
wheel_scroll_multiplier 3.0
mouse_hide_wait 2.0

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index}: {title} "
active_tab_font_style bold

# Integration
# Keep Kitty's shell features without letting fish replace the block cursor.
shell_integration no-cursor
enable_audio_bell no
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Colors
foreground            #cdd6f4
background            #1e1e2e
# Kitty does not apply background_opacity to images. A 0.98 tint leaves the
# artwork at 0.02 (2%) visual strength for better text readability.
background_image        ~/.config/kitty/backgrounds/miku.png
background_image_layout cscaled
background_image_linear yes
background_tint         0.98
selection_foreground  #1e1e2e
selection_background  #f5e0dc
cursor                #f5e0dc
cursor_text_color     #1e1e2e
url_color             #89b4fa
active_border_color   #89b4fa
inactive_border_color #45475a
active_tab_foreground #11111b
active_tab_background #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244

# Common shortcuts
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_tab
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard
